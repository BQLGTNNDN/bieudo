<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo Giải Ngân | Ban QLDA Giao thông & Nông nghiệp Đà Nẵng</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      font-family: 'Segoe UI', system-ui, Arial, sans-serif; 
      background: #f0f2f5;
    }

    /* === TOPBAR === */
    .topbar {
      background: linear-gradient(135deg, #0a1628 0%, #1B3A6B 50%, #1e4d8c 100%);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      position: relative;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .seal {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      border: 2px solid rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .brand-txt strong {
      font-size: 13px; font-weight: 700; color: #fff;
      display: block; line-height: 1.2;
      white-space: nowrap;
    }
    .brand-txt span {
      font-size: 10px; color: rgba(255,255,255,.5);
      display: block;
    }
    .topbar-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .topbar-right .badge {
      font-size: 10px; font-weight: 600; color: #7DD3FC;
      padding: 4px 12px; background: rgba(125,211,252,.12);
      border-radius: 14px; border: 1px solid rgba(125,211,252,.18);
      white-space: nowrap;
    }
    .topbar-right .date {
      font-size: 11px; color: rgba(255,255,255,.6);
      padding: 4px 14px; background: rgba(255,255,255,.06);
      border-radius: 14px; border: 1px solid rgba(255,255,255,.06);
      white-space: nowrap;
    }

    /* === MAIN CONTENT - SCROLLABLE VERTICAL CHARTS === */
    .main-wrap {
      height: calc(100vh - 52px);
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background: #e8ecf1;
      padding: 8px;
    }
    .main-wrap::-webkit-scrollbar {
      width: 8px;
    }
    .main-wrap::-webkit-scrollbar-track {
      background: #d1d5db;
      border-radius: 4px;
    }
    .main-wrap::-webkit-scrollbar-thumb {
      background: #1B3A6B;
      border-radius: 4px;
    }
    .main-wrap::-webkit-scrollbar-thumb:hover {
      background: #0a1628;
    }

    .chart-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
      position: relative;
      margin-bottom: 12px;
    }
    .chart-container:last-child {
      margin-bottom: 0;
    }
    .chart-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .topbar { padding: 0 14px; height: 48px; }
      .seal { width: 28px; height: 28px; font-size: 13px; }
      .brand-txt strong { font-size: 11px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
      .brand-txt span { display: none; }
      .topbar-right .badge { font-size: 9px; padding: 2px 10px; }
      .topbar-right .date { font-size: 10px; padding: 2px 10px; }
      .main-wrap { 
        height: calc(100vh - 48px);
        padding: 6px;
      }
      .chart-container {
        border-radius: 8px;
        margin-bottom: 8px;
        aspect-ratio: 16 / 9;
      }
      .main-wrap::-webkit-scrollbar {
        width: 6px;
      }
    }

    @media (max-width: 480px) {
      .topbar { padding: 0 10px; height: 44px; }
      .seal { width: 24px; height: 24px; font-size: 11px; }
      .brand-txt strong { font-size: 10px; max-width: 100px; }
      .topbar-right .badge { display: none; }
      .topbar-right .date { font-size: 9px; padding: 2px 8px; }
      .main-wrap { 
        height: calc(100vh - 44px);
        padding: 4px;
      }
      .chart-container {
        border-radius: 6px;
        margin-bottom: 6px;
        aspect-ratio: 16 / 9;
      }
      .main-wrap::-webkit-scrollbar {
        width: 4px;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="seal">🏛️</div>
      <div class="brand-txt">
        <strong>BAN GIAO THÔNG &amp; NÔNG NGHIỆP ĐN</strong>
        <span>Báo cáo Giải Ngân · Kế hoạch 2025-2026</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="badge">📊 KH 2026</span>
      <span class="date" id="currentDate">--</span>
    </div>
  </header>

  <div class="main-wrap">
    <div class="chart-container">
      <iframe 
        width="1773" 
        height="1096" 
        seamless 
        frameborder="0" 
        scrolling="no" 
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQU6bsIA9CA1emcyNU8AMBx3eONAN1Q4B5iJA9MPhKxcb-RSwxuTktiT9LWHHxAg6aBrzWnjs4xGqdN/pubchart?oid=353496612&amp;format=interactive">
      </iframe>
    </div>
    <div class="chart-container">
      <iframe 
        width="1773" 
        height="1096" 
        seamless 
        frameborder="0" 
        scrolling="no" 
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQU6bsIA9CA1emcyNU8AMBx3eONAN1Q4B5iJA9MPhKxcb-RSwxuTktiT9LWHHxAg6aBrzWnjs4xGqdN/pubchart?oid=1859141905&amp;format=interactive">
      </iframe>
    </div>
    <div class="chart-container">
      <iframe 
        width="1773" 
        height="1096" 
        seamless 
        frameborder="0" 
        scrolling="no" 
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQU6bsIA9CA1emcyNU8AMBx3eONAN1Q4B5iJA9MPhKxcb-RSwxuTktiT9LWHHxAg6aBrzWnjs4xGqdN/pubchart?oid=1002026926&amp;format=interactive">
      </iframe>
    </div>
    <div class="chart-container">
      <iframe 
        width="1330" 
        height="822" 
        seamless 
        frameborder="0" 
        scrolling="no" 
        src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQU6bsIA9CA1emcyNU8AMBx3eONAN1Q4B5iJA9MPhKxcb-RSwxuTktiT9LWHHxAg6aBrzWnjs4xGqdN/pubchart?oid=1551123399&amp;format=interactive">
      </iframe>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
      document.getElementById('currentDate').textContent = now.toLocaleDateString('vi-VN', options);
    });
  </script>
</body>
</html>
