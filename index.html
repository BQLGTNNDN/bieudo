<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo Giải Ngân Chi Tiết</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #0a1628; /* Nền tối để làm nổi bật biểu đồ */
      color: #fff;
    }

    /* Tiêu đề ghim phía trên */
    .header {
      position: fixed; top: 0; width: 100%; height: 40px;
      background: rgba(27, 58, 107, 0.95);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 20px; z-index: 1000; font-size: 14px; font-weight: bold;
    }

    /* Container cho biểu đồ: Mỗi cái chiếm 100% chiều cao màn hình */
    .chart-section {
      width: 100%;
      height: 100vh; /* Full màn hình */
      padding-top: 40px; /* Chừa chỗ cho header */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>

  <header class="header">
    <span>📊 BÁO CÁO GIẢI NGÂN 2026</span>
    <span id="currentDate"></span>
  </header>

  <!-- Danh sách 4 biểu đồ, mỗi cái nằm trong 1 section 100vh -->
  <main>
    <section class="chart-section">
      <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQU6bsIA9CA1emcyNU8AMBx3eONAN1Q4B5iJA9MPhKxcb-RSwxuTktiT9LWHHxAg6aBrzWnjs4xGqdN/pubchart?oid=353496612&format=interactive"></iframe>
    </section>
    <section class="chart-section">
      <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQU6bsIA9CA1emcyNU8AMBx3eONAN1Q4B5iJA9MPhKxcb-RSwxuTktiT9LWHHxAg6aBrzWnjs4xGqdN/pubchart?oid=1859141905&format=interactive"></iframe>
    </section>
    <section class="chart-section">
      <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQU6bsIA9CA1emcyNU8AMBx3eONAN1Q4B5iJA9MPhKxcb-RSwxuTktiT9LWHHxAg6aBrzWnjs4xGqdN/pubchart?oid=1002026926&format=interactive"></iframe>
    </section>
    <section class="chart-section">
      <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQU6bsIA9CA1emcyNU8AMBx3eONAN1Q4B5iJA9MPhKxcb-RSwxuTktiT9LWHHxAg6aBrzWnjs4xGqdN/pubchart?oid=1551123399&format=interactive"></iframe>
    </section>
  </main>

  <script>
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('vi-VN');
  </script>
</body>
</html>
